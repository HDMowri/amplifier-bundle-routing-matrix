# Routing Matrix: copilot
#
# GitHub Copilot-optimized routing. All roles use models available through
# GitHub Copilot. Use when you want to run entirely on your GitHub Copilot
# subscription.
#
# Pin strategy: exact names, no globs. The provider resolves models from the
# SDK, then a disk cache, then raises ProviderUnavailableError — there is no
# hardcoded fallback, so glob resolution fails when both tiers are unavailable.
# Bump pins manually when new model versions appear in the Copilot API.
#
# One candidate per role: for an exact pin the resolver returns as soon as the
# provider is installed, without checking that the model exists, so in a
# single-provider matrix later candidates are unreachable. Cross-provider
# fallback belongs in the caller's model_role list.
#
# reasoning_effort here is an operator default — a caller-supplied effort takes
# precedence. The provider checks it against the pinned model's advertised
# levels and drops it (INFO log, server default) when the model does not
# advertise it, so a wrong-but-well-formed value fails quietly; only a
# malformed token raises. Check `amplifier provider models` before changing one.
#
# Required roles: "general" and "fast" must be defined in every matrix.
# See docs/MATRIX_CURATOR_GUIDE.md for schema details.

name: copilot
description: "GitHub Copilot-only routing. Strongest model per role across the Claude, GPT, Gemini and MAI families Copilot serves."
updated: "2026-07-28"

roles:
  general:
    description: "Versatile catch-all, no specialization needed"
    candidates:
      - provider: github-copilot
        model: claude-sonnet-5
        config:
          reasoning_effort: high

  fast:
    description: "Quick utility tasks — parsing, classification, file ops, bulk work"
    candidates:
      - provider: github-copilot
        model: mai-code-1-flash-picker

  coding:
    description: "Code generation, implementation, debugging"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: xhigh

  ui-coding:
    description: "Frontend/UI code — components, layouts, styling, spatial reasoning"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: xhigh

  security-audit:
    description: "Vulnerability assessment, attack surface analysis, code auditing"
    candidates:
      - provider: github-copilot
        model: gpt-5.6-sol
        config:
          reasoning_effort: xhigh

  reasoning:
    description: "Deep architectural reasoning, system design, complex multi-step analysis"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: max

  critique:
    description: "Analytical evaluation — finding flaws in existing work, not generating solutions"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: xhigh

  creative:
    description: "Design direction, aesthetic judgment, high-quality creative output"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: high

  writing:
    description: "Long-form content — documentation, marketing, case studies, storytelling"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: high

  research:
    description: "Deep investigation, information synthesis across multiple sources"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: high

  vision:
    description: "Understanding visual input — screenshots, diagrams, UI mockups"
    candidates:
      - provider: github-copilot
        model: gemini-3.1-pro-preview
        config:
          reasoning_effort: high

  image-gen:
    # Copilot has no native image generation API. Falls back to the best
    # creative model for image planning, prompt crafting, and SVG generation.
    description: "Image generation (limited — no native Copilot image API)"
    candidates:
      - provider: github-copilot
        model: claude-opus-5

  critical-ops:
    description: "High-reliability operational tasks — infrastructure, orchestration, coordination"
    candidates:
      - provider: github-copilot
        model: claude-opus-5
        config:
          reasoning_effort: xhigh
